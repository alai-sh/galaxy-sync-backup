[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "galaxy-sync-backup"
version = "0.1.0"
description = "Backs up alai's R2 buckets to Azure Blob Storage, and checks that the backup restores."
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Jordan Borean", email = "jborean93@gmail.com" }]
dependencies = [
    "alai-index == 0.1.0",  # the version galaxy-sync pins
    "alai-sh == 0.1.0",
]

[project.scripts]
galaxy-sync-backup = "galaxy_sync_backup.cli:main"

[dependency-groups]
dev = [
    "basedpyright >= 1.40.2",
    "pytest >= 8",
    "ruff >= 0.17.0",
]

[tool.uv.build-backend]
module-name = "galaxy_sync_backup"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.15"
reportAny = false
reportExplicitAny = false  # the index files and state.json are read as plain JSON
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# S311: random only picks what to sample.
ignore = ["S311"]
select = ["B", "C4", "DTZ", "E4", "E7", "E9", "F", "FURB", "I", "PERF", "PIE", "PTH", "RET", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
# The jobs run the rclone, alai and alai-index commands they're configured with.
"src/galaxy_sync_backup/*.py" = ["S603"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = "tests"
