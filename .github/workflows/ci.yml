name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Lint and type check
      run: |
        uv run --locked ruff check .
        uv run --locked ruff format . --check
        uv run --locked basedpyright --warnings

    - name: Build the image
      run: docker build --platform linux/amd64 --tag galaxy-sync-backup:ci .

    # The second run uses the image's own rclone, which checks LocalRclone behaves like it.
    - name: Test
      run: |
        uv run --locked pytest
        docker run --rm --entrypoint cat galaxy-sync-backup:ci /usr/local/bin/rclone > "$RUNNER_TEMP/rclone"
        chmod +x "$RUNNER_TEMP/rclone"
        TEST_RCLONE="$RUNNER_TEMP/rclone" RCLONE_CONFIG=/dev/null uv run --locked pytest
